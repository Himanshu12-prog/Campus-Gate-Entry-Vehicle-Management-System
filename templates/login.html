{% extends 'base.html' %}

{% block title %}Sign In - Campus Gate Vehicle Management{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-6 sm:my-12">

    <!-- Header Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-teal-600 p-6 text-white text-center">
            <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-2xl font-bold">Campus Gate Access</h2>
            <p class="text-blue-100 text-xs mt-1">Guard Duty Portal & Executive Administration</p>
        </div>

        <!-- Tab Switcher -->
        <div class="flex border-b border-slate-200 bg-slate-50">
            <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-3.5 text-sm font-bold text-center text-blue-600 border-b-2 border-blue-600 focus:outline-none transition-all">
                <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Sign In
            </button>
            <button id="tab-signup-btn" onclick="switchTab('signup')" class="flex-1 py-3.5 text-sm font-bold text-center text-slate-500 hover:text-slate-700 focus:outline-none transition-all">
                <i class="fa-solid fa-user-plus mr-1.5"></i> Create Account
            </button>
        </div>

        <div class="p-6">
            <!-- LOGIN FORM -->
            <div id="form-login" class="space-y-4">
                <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
                    <input type="hidden" name="action" value="login">

                    <div>
                        <label for="identifier" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Mobile Phone Number / Admin Username
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <input type="text" id="identifier" name="identifier" value="{{ prefill_id or '' }}" required placeholder="Guard Phone No or Admin Username"
                                   class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Password
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <input type="password" id="password" name="password" required placeholder="••••••••"
                                   class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm shadow-md hover:shadow-lg transition-all duration-150 flex items-center justify-center space-x-2">
                        <span>Sign In to Portal</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>

            <!-- REGISTRATION FORM (GUARD & ADMIN SIGNUP) -->
            <div id="form-signup" class="space-y-4 hidden">
                <form action="{{ url_for('login') }}" method="POST" onsubmit="return validateSignupForm()" class="space-y-4">
                    <input type="hidden" name="action" value="signup">

                    <!-- Role Selector -->
                    <div>
                        <label for="role" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                            Account Type / Role <span class="text-rose-500">*</span>
                        </label>
                        <select id="role" name="role" onchange="toggleRoleFields(this.value)"
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-teal-500 outline-none transition">
                            <option value="guard" selected>Gate Guard Account</option>
                            <option value="admin">Principal / Admin Executive Account</option>
                        </select>
                    </div>

                    <div>
                        <label for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Full Name <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="name" name="name" required placeholder="e.g. Vikram Sharma"
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-teal-500 outline-none transition">
                    </div>

                    <div>
                        <label id="phone-label" for="signup_phone" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            10-Digit Mobile Phone Number <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="signup_phone" name="phone" required placeholder="e.g. 9876543210"
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-teal-500 outline-none transition">
                        <p id="phone-hint" class="text-[11px] text-slate-500 mt-1">This will be used as Guard Login ID.</p>
                    </div>

                    <div>
                        <label for="signup_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Password <span class="text-rose-500">*</span>
                        </label>
                        <input type="password" id="signup_password" name="password" required placeholder="Create password"
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-teal-500 outline-none transition">
                    </div>

                    <div>
                        <label for="confirm_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                            Confirm Password <span class="text-rose-500">*</span>
                        </label>
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm password"
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:ring-2 focus:ring-teal-500 outline-none transition">
                    </div>

                    <button type="submit" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-sm shadow-md hover:shadow-lg transition-all duration-150 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>Register Account</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function switchTab(tab) {
        const loginForm = document.getElementById('form-login');
        const signupForm = document.getElementById('form-signup');
        const loginBtn = document.getElementById('tab-login-btn');
        const signupBtn = document.getElementById('tab-signup-btn');

        if (tab === 'login') {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            loginBtn.className = "flex-1 py-3.5 text-sm font-bold text-center text-blue-600 border-b-2 border-blue-600 focus:outline-none transition-all";
            signupBtn.className = "flex-1 py-3.5 text-sm font-bold text-center text-slate-500 hover:text-slate-700 focus:outline-none transition-all";
        } else {
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            signupBtn.className = "flex-1 py-3.5 text-sm font-bold text-center text-teal-600 border-b-2 border-teal-600 focus:outline-none transition-all";
            loginBtn.className = "flex-1 py-3.5 text-sm font-bold text-center text-slate-500 hover:text-slate-700 focus:outline-none transition-all";
        }
    }

    function toggleRoleFields(role) {
        const phoneLabel = document.getElementById('phone-label');
        const phoneHint = document.getElementById('phone-hint');
        const phoneInput = document.getElementById('signup_phone');

        if (role === 'admin') {
            phoneLabel.innerHTML = 'Admin Username or Mobile Number <span class="text-rose-500">*</span>';
            phoneHint.innerText = 'Enter your Admin Username or 10-digit mobile number.';
            phoneInput.placeholder = 'e.g. principal_admin or 9998887776';
        } else {
            phoneLabel.innerHTML = '10-Digit Mobile Phone Number <span class="text-rose-500">*</span>';
            phoneHint.innerText = 'This will be used as Guard Login ID.';
            phoneInput.placeholder = 'e.g. 9876543210';
        }
    }

    function validateSignupForm() {
        const role = document.getElementById('role').value;
        const phoneInput = document.getElementById('signup_phone');
        const pass = document.getElementById('signup_password').value;
        const confirmPass = document.getElementById('confirm_password').value;

        const val = phoneInput.value.trim();
        if (role === 'guard' && !/^\d{10}$/.test(val)) {
            alert('Guard phone number must be exactly 10 numeric digits.');
            phoneInput.focus();
            return false;
        }

        if (pass !== confirmPass) {
            alert('Passwords do not match.');
            return false;
        }

        return true;
    }

    {% if active_tab == 'signup' %}
    switchTab('signup');
    {% endif %}
</script>
{% endblock %}
